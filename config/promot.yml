# PURL configuration for http://purl.obolibrary.org/obo/promot

idspace: PROMOT
base_url: /obo/promot

products:
- promot-en.owl: https://raw.githubusercontent.com/JuPoIm/promot_ontology/main/promot-en.owl
- promot-en.obo: https://raw.githubusercontent.com/JuPoIm/promot_ontology/main/promot-en.obo

term_browser: ontobee
example_terms:
- PROMOT_0000000

entries:

- prefix: /releases/
  replacement: https://raw.githubusercontent.com/JuPoIm/promot_ontology/v

- prefix: /tracker/
  replacement: https://github.com/JuPoIm/promot_ontology/issues

- prefix: /about/
  replacement: http://www.ontobee.org/ontology/PROMOT?iri=http://purl.obolibrary.org/obo/

## generic fall-through, serve direct from github by default
- prefix: /
  replacement: https://raw.githubusercontent.com/JuPoIm/promot_ontology/main/
